<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Task List</h1>
        <p>Organize suas tarefas</p>
    </header>

    <main>
        <h2>Minhas tarefas</h2>

        <form id="form-tarefa">
            <label for="nova-tarefa">Nova tarefa</label>

            <div class="formulario">
                <input type="text" id="nova-tarefa"
                       placeholder="Digite uma tarefa">

                <button type="submit" class="btn-adicionar">
                    Adicionar
                </button>
            </div>
        </form>

        <div class="filtros">
            <button type="button" class="btn-filtro" data-filtro="todas">
                Todas
            </button>

            <button type="button" class="btn-filtro" data-filtro="pendente">
                Pendentes
            </button>

            <button type="button" class="btn-filtro" data-filtro="concluida">
                Concluídas
            </button>
        </div>

        <ul class="lista-tarefas">
            <li class="tarefa">
                <span>Estudar Gitflow</span>
                <span class="pendente">Pendente</span>
            </li>

            <li class="tarefa">
                <span>Criar repositório</span>
                <span class="concluida">Concluída</span>
            </li>
        </ul>
    </main>

    <footer>
        <p>Task List - 2026</p>
    </footer>

    <script src="formulario.js"></script>
    <script src="filtro.js"></script>

</body>
</html>
